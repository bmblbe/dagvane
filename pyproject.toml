[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dagvane"
description = "Dagvane engine — greenfield walking skeleton (G0): deterministic fake-backend council runs."
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]
# license, authors, and URLs are deliberately absent: pending owner decisions
# (OWNER_AMENDMENT_001 "Remaining owner decisions").

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
dagvane = "dagvane.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dagvane.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Legacy editor tooling is intentionally untouched by G0 (owner follow-up).
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "tests"]
files = ["src/dagvane", "tests"]

# Not a dependency: pytest's TYPE_CHECKING block imports numpy for approx(),
# and the system numpy stubs use 3.12+ syntax that breaks a 3.11-target run.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
